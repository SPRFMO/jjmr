url: https://sprfmo.github.io/jjmr/

template:
  bootstrap: 5

home:
  title: "jjmR"
  description: "Graphics and diagnostics tools for SPRFMO's Joint Jack Mackerel (JJM) model."

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [github]
  components:
    github:
      icon: fa-github
      href: https://github.com/SPRFMO/jjmr

reference:
  - title: "Annex diagnostics"
    contents:
      - jjm_label
      - jjm_pfa_palette
      - starts_with("extr_")
      - has_comp
      - starts_with("comp_fig")
      - starts_with("facet_fig")
      - calc_mohn_rho
      - strong_cohorts
      - annotate_cohorts
      - read_historic_retro
  - title: "Package"
    contents:
      - starts_with("read")
      - starts_with("get_")
      - starts_with("plot")
      - tidy_JJM
      - combineModels
